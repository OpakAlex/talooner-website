      position: fixed;
      inset: 0 auto 0 0;
      width: 15rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      padding: 1.6rem 1rem;
      border-right: 1px solid var(--border);
      background: var(--theme);
      overflow-y: auto;
      z-index: 20;

      font-size: 1.3rem;
      color: var(--primary);
      margin: 0.2rem 0.6rem 1.1rem;
      text-decoration: none;
    }

    .tln-side .link {
      color: var(--primary);
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      font-size: 1rem;
      line-height: 1.2;
      text-decoration: none;
    }
    .tln-side .link:hover { background: var(--tertiary); }
