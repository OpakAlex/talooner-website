baseURL = "https://talooner.dev/"
locale = "en-us"
title = "Talooner — Deterministic PR Review"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

[params]
  env = "production"
  label = { text = "Talooner" }
  description = "Talooner is the first line of defense for your product — a deterministic guard for GitHub and GitLab that reviews code, checks design against Figma, and runs generated QA scenarios. Rules decide the verdict; a model is consulted only where a rule asks for it."
  keywords = ["talooner", "pr review", "code review bot", "tln", "opentalon", "deterministic", "automated qa"]
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  hideMeta = true
  disableSpecial1stPost = true
  hideSocialInFooter = true
  DateFormat = "2006-01-02"

  [params.homeInfoParams]
    Title = "The first line of defense for your product."
    Content = "Talooner is a deterministic guard for GitHub and GitLab — and it's more than a review bot. Your repository declares its policy as `tln` rules; Talooner ingests PR facts, runs them through the inference engine, and executes the resulting actions: it reviews the diff, checks your UI against Figma, and generates and runs QA scenarios. A model is consulted **only** where a rule says `do llm_review` — and its answer re-enters the engine as a typed fact. Same commit, same rules, same verdict — every time."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/opentalon/talooner"

  [params.assets]
    disableHLJS = true

[minify]
  # The HTML minifier rewrites inline-SVG numbers to scientific notation
  # (1000 -> 1e3), which SVG attributes like viewBox reject. Keep SVG intact.
  disableSVG = true

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    identifier = "how-it-works"
    name = "How it works"
    pageRef = "/how-it-works/"
    weight = 10
  [[menu.main]]
    identifier = "automated-qa"
    name = "Automated QA"
    pageRef = "/automated-qa/"
    weight = 20
  [[menu.main]]
    identifier = "rules"
    name = "Rules"
    pageRef = "/rules/"
    weight = 30
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/opentalon/talooner"
    weight = 50
